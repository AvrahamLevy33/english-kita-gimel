<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>המורה לאנגלית שלי – הכנה למבחן כיתה ג'</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#fff8ec; --card:#ffffff; --ink:#2d2a4a; --muted:#7a7694;
  --pri:#6c5ce7; --pri2:#a29bfe; --ok:#00b894; --bad:#ff7675; --sun:#fdcb6e;
  --pink:#fd79a8; --sky:#74b9ff; --mint:#55efc4; --orange:#fab1a0;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Rubik,system-ui,sans-serif}
body{min-height:100vh}
.wrap{max-width:620px;margin:0 auto;padding:16px 14px 40px}
header{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.brand{display:flex;align-items:center;gap:10px}
.owl{font-size:42px;line-height:1}
h1{font-size:20px;margin:0;font-weight:800}
.sub{font-size:13px;color:var(--muted);margin-top:2px}
.stars{background:#fff;border-radius:999px;padding:6px 12px;font-weight:700;box-shadow:0 2px 0 #f0e2c8;white-space:nowrap}
.bubble{background:#fff;border-radius:18px;padding:12px 14px;box-shadow:0 3px 0 #f0e2c8;margin:6px 0 16px;font-size:15px;line-height:1.5}
.menu{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{border:0;border-radius:20px;padding:16px 10px;font-family:inherit;color:var(--ink);cursor:pointer;
  box-shadow:0 5px 0 rgba(0,0,0,.12);text-align:center;transition:transform .08s}
.tile:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(0,0,0,.12)}
.tile .ic{font-size:34px;display:block;margin-bottom:6px}
.tile b{display:block;font-size:16px}
.tile small{display:block;font-size:12px;color:#4b4766;margin-top:3px}
.tile .prog{margin-top:6px;font-size:13px;letter-spacing:1px}
.tile.wide{grid-column:1/-1;background:linear-gradient(135deg,var(--pri),#8e7cf3);color:#fff}
.tile.wide small{color:#e9e5ff}
.c1{background:#ffeaa7}.c2{background:#d6f5ff}.c3{background:#ffd9e6}.c4{background:#d7f9ec}.c5{background:#e8e2ff}.c6{background:#ffe3d3}.c7{background:#f0f0f0}
.topbar{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.back{border:0;background:#fff;border-radius:12px;padding:8px 12px;font-family:inherit;font-size:15px;box-shadow:0 2px 0 #f0e2c8;cursor:pointer}
.bar{flex:1;height:12px;background:#f1e6cf;border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--ok);width:0;transition:width .3s}
.qcard{background:var(--card);border-radius:24px;padding:18px 14px 20px;box-shadow:0 5px 0 #f0e2c8;text-align:center}
.qtitle{font-size:16px;color:var(--muted);margin-bottom:12px;line-height:1.4}
.speak{border:0;background:var(--pri);color:#fff;border-radius:50%;width:96px;height:96px;font-size:44px;cursor:pointer;
  box-shadow:0 6px 0 #4b3fc0;margin:4px auto 6px;display:flex;align-items:center;justify-content:center}
.speak:active{transform:translateY(4px);box-shadow:0 2px 0 #4b3fc0}
.speak.small{width:44px;height:44px;font-size:20px;box-shadow:0 3px 0 #4b3fc0;display:inline-flex;margin:0 6px;vertical-align:middle}
.again{font-size:13px;color:var(--muted);margin-bottom:12px}
.big{font-size:56px;font-weight:800;direction:ltr;margin:6px 0 14px;letter-spacing:1px}
.eng{direction:ltr;font-weight:700}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:10px}
.opts.three{grid-template-columns:1fr 1fr 1fr}
.opt{border:3px solid #ece4d4;background:#fff;border-radius:18px;min-height:96px;padding:10px 6px;font-family:inherit;
  font-size:22px;color:var(--ink);cursor:pointer;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:4px}
.opt .pic{font-size:46px;line-height:1.1}
.opt .pic svg{width:58px;height:58px}
.opt.letter{font-size:48px;font-weight:800;direction:ltr;min-height:90px}
.opt.heb{font-size:22px;font-weight:700;min-height:70px}
.opt.ok{border-color:var(--ok);background:#e3fbf3;animation:pop .35s}
.opt.no{border-color:var(--bad);background:#ffecec;animation:shake .35s}
.opt:disabled{cursor:default}
@keyframes pop{50%{transform:scale(1.08)}}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.feedback{min-height:56px;margin-top:14px;font-size:18px;font-weight:700}
.feedback .hint{display:block;font-size:14px;font-weight:400;color:var(--muted);margin-top:4px}
.next{border:0;background:var(--ok);color:#fff;font-family:inherit;font-size:20px;font-weight:700;border-radius:16px;padding:12px 30px;
  box-shadow:0 5px 0 #00896d;cursor:pointer;margin-top:6px}
.next:active{transform:translateY(3px);box-shadow:0 2px 0 #00896d}
.end{text-align:center}
.end .trophy{font-size:80px}
.end h2{margin:6px 0}
.end .score{font-size:22px;margin:8px 0 16px}
.btnrow{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.btn2{border:0;background:#fff;font-family:inherit;font-size:17px;border-radius:14px;padding:11px 20px;box-shadow:0 4px 0 #f0e2c8;cursor:pointer}
.review{margin-top:18px;text-align:right;background:#fff;border-radius:18px;padding:12px 14px;box-shadow:0 3px 0 #f0e2c8}
.review h3{margin:0 0 6px;font-size:16px}
.review li{margin:4px 0;font-size:15px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.fc{background:#fff;border-radius:16px;padding:10px;box-shadow:0 3px 0 #f0e2c8;text-align:center;cursor:pointer;border:0;font-family:inherit;color:var(--ink)}
.fc .pic{font-size:40px;height:52px;display:flex;align-items:center;justify-content:center}
.fc .pic svg{width:50px;height:50px}
.fc .w{direction:ltr;font-weight:700;font-size:18px;margin-top:4px}
.fc .h{color:var(--muted);font-size:14px}
.note{font-size:13px;color:var(--muted);text-align:center;margin-top:14px;line-height:1.5}
.warn{background:#fff3cd;border-radius:12px;padding:10px;font-size:14px;margin-bottom:12px;display:none}
.sentence{direction:ltr;font-size:30px;font-weight:800;margin:8px 0 6px}
.reveal{font-size:13px;color:var(--muted);text-decoration:underline;background:none;border:0;font-family:inherit;cursor:pointer}
.hidden{display:none!important}
.confetti{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:50}
.confetti span{position:absolute;top:-30px;font-size:26px;animation:fall 1.6s linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(360deg)}}
.levels{display:flex;gap:10px;margin:4px 0 12px}
.lv{flex:1;border:3px solid #ece4d4;background:#fff;border-radius:16px;padding:10px;font-family:inherit;font-size:18px;font-weight:700;color:var(--ink);cursor:pointer}
.lv small{display:block;font-size:12px;font-weight:400;color:var(--muted)}
.lv.on{border-color:var(--pri);background:#efeaff}
body.lvl2 .lv.on{border-color:#e17055;background:#fff0ea}
body.lvl2{background:#fff3ea}
body.lvl3{background:#eef4ff}
body.lvl4{background:#fdf3ff}
body.lvl4 .lv.on{border-color:#a55eea;background:#f6e9ff}
.levels .lv{font-size:15px}.levels .lv small{font-size:11px}
.stile{background:linear-gradient(135deg,#fd79a8,#fdcb6e)!important;color:#fff}.stile small{color:#fff}
.rtile{background:linear-gradient(135deg,#0984e3,#74b9ff)!important;color:#fff}.rtile small{color:#eaf4ff}
.badge{display:inline-block;background:#d63031;color:#fff;border-radius:99px;padding:0 9px;font-size:14px;margin-right:4px}
.story{text-align:center}
.stitle{font-size:20px;font-weight:800;margin-bottom:10px;direction:ltr}
.slines{text-align:left;direction:ltr;margin-bottom:12px}
.sline{font-size:20px;line-height:1.45;padding:8px 10px;border-radius:12px;margin:4px 0;transition:all .2s}
.sline.todo{color:#b9b4cc}
.sline.done{color:#00896d}
.sline.cur{background:#fff6d8;font-size:24px;font-weight:700;box-shadow:0 0 0 3px #fdcb6e inset}
.missw{color:#d63031;text-decoration:underline wavy #d63031;text-underline-offset:4px}
.sstatus{font-size:17px;font-weight:700;margin:6px 0;line-height:1.5}
.sfull{background:#faf6ee;border-radius:14px;padding:10px;margin:10px 0;text-align:left;line-height:1.6}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;background:#fff;border-radius:14px;box-shadow:0 2px 0 #f0e2c8;overflow:hidden}
.chipw{border:0;background:none;font-family:inherit;font-size:16px;padding:8px 10px;cursor:pointer;color:var(--ink)}
.chipw small{color:var(--muted)}
.live{direction:ltr;font-size:14px;color:var(--muted);min-height:20px;margin-top:4px}
.chipx{border:0;background:#ffecec;color:#c0392b;font-size:13px;padding:8px 9px;cursor:pointer}
body.lvl3 .lv.on{border-color:#0984e3;background:#e3f0ff}
.lv{padding:10px 4px}
.c8{background:#dff3e4}
.opts.three{grid-template-columns:1fr 1fr 1fr}
.opts.three .opt{min-height:84px}
.opts.three .opt .pic{font-size:38px}
.opts.three .opt .pic svg{width:46px;height:46px}
.opts.three .opt.letter{font-size:38px;min-height:76px}
.opts.three .opt.heb{font-size:17px}
.opts.rows{grid-template-columns:1fr}
.opts.rows .opt{min-height:64px}
.opt .pic{word-break:break-all;line-height:1.3;direction:ltr;unicode-bidi:isolate}
.tag{display:inline-block;background:#ffe1d6;color:#c0392b;border-radius:99px;padding:4px 12px;font-size:13px;font-weight:700;margin-bottom:8px}
.ans{width:100%;max-width:320px;font-family:inherit;font-size:24px;padding:12px 14px;border-radius:14px;border:3px solid #ece4d4;text-align:center;margin-bottom:12px;outline:none}
.ans:focus{border-color:var(--pri2)}
.c9{background:#ffe0ef}
.mic{border:0;background:#e84393;color:#fff;border-radius:50%;width:104px;height:104px;font-size:48px;cursor:pointer;
  box-shadow:0 6px 0 #a3226a;margin:10px auto 4px;display:flex;align-items:center;justify-content:center}
.mic:active{transform:translateY(4px);box-shadow:0 2px 0 #a3226a}
.mic.rec{animation:pulse 1s infinite;background:#d63031}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(214,48,49,.6)}70%{box-shadow:0 0 0 22px rgba(214,48,49,0)}100%{box-shadow:0 0 0 0 rgba(214,48,49,0)}}
.spic{font-size:84px;line-height:1.1;margin:4px 0}
.spic svg{width:96px;height:96px}
.say-word{direction:ltr;font-size:40px;font-weight:800;margin:4px 0}
.tr{font-size:16px;color:var(--muted);margin-bottom:6px}
.lnk{border:0;background:#f3efff;color:var(--pri);border-radius:12px;padding:8px 14px;font-family:inherit;font-size:15px;cursor:pointer;margin:4px}
.heard{direction:ltr;display:inline-block;background:#f6f1e6;border-radius:10px;padding:2px 10px;margin-top:4px;font-weight:700}
.parent{display:flex;gap:10px;justify-content:center;margin-top:10px;flex-wrap:wrap}
.parent button{border:0;border-radius:14px;padding:12px 16px;font-family:inherit;font-size:17px;font-weight:700;cursor:pointer}
.pg{background:var(--ok);color:#fff;box-shadow:0 4px 0 #00896d}.pb{background:#ffecec;color:#c0392b;box-shadow:0 4px 0 #f5c6c6}
.pnote{font-size:13px;color:var(--muted);margin-top:8px;line-height:1.5}
.pchip{border:0;background:#fff;border-radius:16px;padding:6px 12px;font-family:inherit;font-size:15px;font-weight:700;box-shadow:0 2px 0 #f0e2c8;cursor:pointer;white-space:nowrap;color:var(--ink);text-align:center}
.pchip small{display:block;font-size:11px;font-weight:400;color:var(--muted)}
.pgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.pcard-wrap{display:flex;flex-direction:column;gap:6px}
.pcard{border:0;background:#fff;border-radius:20px;padding:16px 8px;font-family:inherit;color:var(--ink);cursor:pointer;box-shadow:0 5px 0 #f0e2c8;width:100%}
.pcard:active{transform:translateY(3px);box-shadow:0 2px 0 #f0e2c8}
.pcard .pav{font-size:54px;display:block;line-height:1.1}
.pcard b{display:block;font-size:19px;margin-top:4px}
.pcard small{display:block;color:var(--muted);font-size:13px;margin-top:3px}
.pcard.add{background:#f3efff;border:3px dashed var(--pri2);box-shadow:none}
.pman{display:flex;gap:6px}.pman button{flex:1;border:0;background:#fff;border-radius:10px;padding:6px;font-family:inherit;font-size:13px;cursor:pointer;box-shadow:0 2px 0 #f0e2c8}
.avgrid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px;max-width:400px;margin:0 auto}
.avb{border:3px solid transparent;background:#faf6ee;border-radius:12px;font-size:26px;padding:4px 0;cursor:pointer}
.avb.on{border-color:var(--pri);background:#efeaff}

.ans.ok{border-color:var(--ok);background:#e3fbf3}.ans.no{border-color:var(--bad);background:#ffecec}
</style>
</head>

<div class="wrap" id="app"></div>

<script>
/* ============ DATA ============ */
// Pictures: emoji or small inline SVG for words without a good emoji
const SVG = {

  onbox:'<svg viewBox="0 0 64 64"><circle cx="32" cy="19" r="9" fill="#e17055"/><rect x="10" y="30" width="44" height="26" rx="2" fill="#c0844a"/></svg>',
  big:'<svg viewBox="0 0 64 64"><circle cx="38" cy="34" r="22" fill="#6c5ce7"/><circle cx="9" cy="52" r="5" fill="#b2bec3"/><text x="38" y="40" font-size="16" text-anchor="middle" fill="#fff" font-weight="700">BIG</text></svg>',
  gray:'<svg viewBox="0 0 64 64"><path d="M10 40 Q4 18 26 16 Q32 6 44 14 Q60 14 56 34 Q62 50 44 50 L18 50 Q6 50 10 40Z" fill="#9aa0a6"/></svg>',
  plus:'<svg viewBox="0 0 64 64"><text x="32" y="44" font-size="26" text-anchor="middle" font-weight="800" fill="#2d2a4a" font-family="Rubik,sans-serif">2+1</text></svg>',

};
const VOCAB = [
  {w:'grandma',h:'סבתא',p:'👵'},
  {w:'grandpa',h:'סבא',p:'👴'},
  {w:'gift',h:'מתנה',p:'🎁'},
  {w:'gray',h:'אפור',s:'gray'},
  {w:'door',h:'דלת',p:'🚪'},
  {w:'house',h:'בית',p:'🏠'},
  {w:'elephant',h:'פיל',p:'🐘'},
  {w:'egg',h:'ביצה',p:'🥚'},
  {w:'eraser',h:'מחק',s:'eraser'},
  {w:'school',h:'בית ספר',p:'🏫'},
  {w:'pencil',h:'עיפרון',p:'✏️'},
  {w:'bed',h:'מיטה',p:'🛏️'},
  {w:'table',h:'שולחן',s:'table'},
  {w:'test',h:'מבחן',p:'📝'},
  {w:'teacher',h:'מורה',p:'🧑‍🏫'},
  {w:'pen',h:'עט',p:'🖊️'},
  {w:'pencil case',h:'קלמר',s:'pencilcase'},
  {w:'hat',h:'כובע',p:'👒'},
  {w:'add',h:'להוסיף',p:'➕'},
  {w:'plus',h:'פלוס',s:'plus'},
  {w:'in',h:'בתוך',s:'inbox'},
  {w:'on',h:'על',s:'onbox'},
  {w:'pupil',h:'תלמיד / תלמידה',p:'🧑‍🎓'},
  {w:'picture',h:'תמונה',p:'🖼️'},
  {w:'chair',h:'כיסא',p:'🪑'},
  {w:'dad',h:'אבא',p:'👨'},
  {w:'lost',h:'אבוד / הלך לאיבוד',s:'lost'},
  {w:'big',h:'גדול',s:'big'},
  {w:'ask',h:'לשאול',p:'🙋'},
  {w:'bad',h:'רע',p:'👎'},
  {w:'duck',h:'ברווז',p:'🦆'},
  {w:'nose',h:'אף',p:'👃'},
  {w:'mouth',h:'פה',p:'👄'}
];
// confusable groups to avoid as distractors together
const CONFUSE = [['add','plus'],['pen','pencil'],['grandma','grandpa'],['house','school','door'],['teacher','pupil'],['nose','mouth']];

const NUMBERS = ['zero','one','two','three','four','five','six','seven','eight','nine','ten','eleven','twelve'];
const LETTERS = ['a','b','d','e','g','i','n','t'];
// words for first-sound practice (only words that start with a learned letter)

  ['add','a'],['ask','a'],
  ['bed','b'],['big','b'],['bad','b'],
  ['dad','d'],['door','d'],['duck','d'],
  ['egg','e'],['elephant','e'],['eraser','e'],

/* ============ LEVEL 2 DATA ============ */
const READ2 = [
  {w:'I have a bag.',h:'יש לי תיק.'},{w:'I like eggs.',h:'אני אוהבת ביצים.'},{w:'I am Dan.',h:'אני דן.'},
  {w:'I have a big bed.',h:'יש לי מיטה גדולה.'},{w:'I like dad.',h:'אני אוהבת את אבא.'},{w:'I have an egg.',h:'יש לי ביצה.'},
  {w:'I am big.',h:'אני גדולה.'},{w:'I like Ann.',h:'אני אוהבת את אן.'},{w:'I have a bed.',h:'יש לי מיטה.'},
  {w:'I like a big bag.',h:'אני אוהבת תיק גדול.'},{w:'I am Ann.',h:'אני אן.'},{w:'I have a big egg.',h:'יש לי ביצה גדולה.'}
];

const $ = s=>document.querySelector(s);
const shuffle = a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const pick = (a,n)=>shuffle(a).slice(0,n);
const picHTML = v => v.s ? SVG[v.s] : v.p;
const cap = s => s[0].toUpperCase()+s.slice(1);
const rnd = n => Math.floor(Math.random()*n);
function confusable(a,b){return CONFUSE.some(g=>g.includes(a)&&g.includes(b))}
function sim(a,b){ // rough look-alike score
  let s=0; const A=a.toLowerCase(),B=b.toLowerCase();
  if(A.length===B.length) s+=2;
  for(let i=0;i<Math.min(A.length,B.length);i++) if(A[i]===B[i]) s+=2;
  for(const c of new Set(A)) if(B.includes(c)) s+=1;
  return s+Math.random()*2;
}
function lookalikes(t,pool,n){return pool.filter(v=>v.w!==t.w).sort((x,y)=>sim(t.w,y.w)-sim(t.w,x.w)).slice(0,n)}

let voice=null, ttsOK = 'speechSynthesis' in window;
function loadVoices(){
  if(!ttsOK) return;
  const vs = speechSynthesis.getVoices();
  voice = vs.find(v=>/en[-_]US/i.test(v.lang)&&/Samantha|Google|Female|Aria|Jenny/i.test(v.name))
       || vs.find(v=>/en[-_]US/i.test(v.lang)) || vs.find(v=>/^en/i.test(v.lang)) || null;
}
if(ttsOK){loadVoices(); speechSynthesis.onvoiceschanged=loadVoices;}
function say(text, rate){
  if(!ttsOK) return false;
  try{
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang='en-US'; u.rate=rate||(LEVEL>=2?0.95:0.8); if(voice) u.voice=voice;
    speechSynthesis.speak(u); return true;
  }catch(e){return false}

function normEn(s){
  return (s||'').toLowerCase().replace(/[.,!?'"]/g,' ').replace(/(\d),(\d{3})/g,'$1$2').replace(/\b(\d+)\b/g,(m,d)=>(+d<=1000?num2wBig(+d,false).replace(/-/g,' '):m)).replace(/-/g,' ')
    .replace(/\bgrey\b/g,'gray').replace(/\s+/g,' ').trim();
}
function wEq(a,b){return a===b || (HOMO[a]||[]).includes(b) || (HOMO[b]||[]).includes(a)}
function lev(a,b){const d=[...Array(b.length+1).keys()];for(let i=1;i<=a.length;i++){let p=d[0];d[0]=i;
  for(let j=1;j<=b.length;j++){const t=d[j];d[j]=Math.min(d[j]+1,d[j-1]+1,p+(a[i-1]===b[j-1]?0:1));p=t}}return d[b.length]}
// returns {ok, near, best}
// consonant "skeleton" so that kid/accented pronunciations still match (tree≈three, elefent≈elephant)
function phon(w){
  w=(w||'').toLowerCase().replace(/[^a-z]/g,''); if(!w) return '';
  const f=w[0];
  w=w.replace(/^kn/,'n').replace(/^wr/,'r').replace(/ph/g,'f').replace(/th/g,'t').replace(/ck/g,'k').replace(/ch/g,'c')
     .replace(/c(?=[eiy])/g,'s').replace(/[cq]/g,'k').replace(/x/g,'ks').replace(/z/g,'s').replace(/v/g,'b').replace(/gh/g,'')
     .replace(/(.)\1+/g,'$1');
  const rest=w.slice(1).replace(/[aeiouyhw]/g,'');
  return ('aeiou'.includes(f)?'a':w[0])+rest;
}
// split recognizer output into words, also gluing neighbours ("pencil" + "case", "grand" + "ma")
function words(alt){
  const A=normEn(alt).split(' ').filter(Boolean); const out=[...A];
  for(let i=0;i<A.length-1;i++) out.push(A[i]+A[i+1]);
  return out;

function wordMatch(t,a){
  if(wEq(t,a)) return 2;                                   // exact / homophone
  if(NUMWORDS.has(t)) return (t==='three'&&a==='tree')||(t==='thirteen'&&a==='thirteen')?1:0; // numbers must be the right number
  const lenient = LEVEL===1;
  if(t.length<=3 && t[0]!==a[0]) return 0;                 // short words: in ≠ on, egg ≠ add
  const d=lev(t,a), L=Math.max(t.length,a.length);
  if(L>=4 && d<=1) return 1;                               // one letter off
  if(lenient && L>=6 && d<=2) return 1;
  const pt=phon(t), pa=phon(a);
  if(pt && pt===pa && (lenient || t.length>=4)) return 1;  // sounds the same
  if(lenient && pt.length>=3 && lev(pt,pa)<=1 && Math.abs(t.length-a.length)<=2) return 1;
  return 0;
}
// returns {ok, near, best}
function judge(target, alts){
  const T=normEn(target).split(' ');
  const single = T.length<=2;
  const need = single?1:(LEVEL>=2?0.85:0.7);
  let best='', bestR=-1, near=false;
  for(const alt of alts){
    const A=words(alt);
    let hit=0;
    for(const t of T){
      // short function words (a, an, the, I) are often dropped by the recognizer – don't punish that in sentences
      if(!single && ['a','an','the','i'].includes(t)){hit++;continue}
      let m=0; for(const a of A){m=Math.max(m,wordMatch(t,a)); if(m===2)break}
      if(m) hit++; else if(NUMWORDS.has(t)) hit-=T.length; // a wrong number = wrong sentence
    }
    // single word: the whole utterance glued together may match ("grand pa" → grandpa)
    if(single && hit<T.length){const g=normEn(alt).replace(/ /g,''); if(wordMatch(T.join(''),g)) hit=T.length;}
    const r=hit/T.length;
    if(r>bestR){bestR=r;best=alt}
    if(single && T.length===1 && (NEAR[T[0]]||[]).some(n=>A.includes(n))) near=true;
  }
  return {ok:bestR>=need, near:near&&bestR<need, best, ratio:bestR};
}

function numTraps(n){
  const c=new Set();
  if(n>=13&&n<=19) c.add((n-10)*10); if(n%10===0&&n>=30&&n<=90) c.add(n/10+10);
  if(n>=10&&n%10!==0&&n<100){const r=(n%10)*10+Math.floor(n/10); if(r!==n&&r<=100) c.add(r);}
  [n+1,n-1,n+10,n-10,n+2].forEach(x=>c.add(x));
  return [...c].filter(x=>x>=0&&x<=100&&x!==n);
}
function sixNums(n){
  let o=numTraps(n).slice(0,5);
  while(o.length<5){const x=rnd(101); if(x!==n&&!o.includes(x)) o.push(x)}
  return shuffle([n,...o]);
}

function num2wBig(n,withAnd){

  const c=new Set(), h=Math.floor(n/100), t=Math.floor(n/10)%10, u=n%10;
  [n+100,n-100,n+10,n-10,n+1,n-1].forEach(x=>c.add(x));
  if(t===1&&u>=3) c.add(h*100+u*10);                 // 315 ↔ 350
  if(t>=3&&u===0) c.add(h*100+10+t);                  // 350 ↔ 315
  c.add(h*100+u*10+t);                                // 345 ↔ 354
  if(u>0) c.add(u*100+t*10+h);                        // 345 ↔ 543
  return [...c].filter(x=>x>=100&&x<=1000&&x!==n);
}
function sixNums4(n){
  let o=shuffle(numTraps4(n)).slice(0,5);
  while(o.length<5){const x=100+rnd(901); if(x!==n&&!o.includes(x)) o.push(x)}

}

function misspell(w){
  const out=new Set(), V='aeiou';
  const tries=[
    s=>s.replace(/ph/,'f'), s=>s.replace(/ck/,'k'), s=>s.replace(/c(?=[aou])/,'k'), s=>s.replace(/k/,'c'),
    s=>s.replace(/(.)\1/,'$1'), s=>s.replace(/([^aeiou])([aeiou])([^aeiou])/,'$1$2$3$3'), s=>s.replace(/e$/,''),
    s=>s.replace(/ee/,'ea'), s=>s.replace(/ea/,'ee'), s=>s.replace(/oo/,'u'), s=>s.replace(/y$/,'ie'), s=>s.replace(/ie/,'ei'),
    s=>s.replace(/sh/,'ch'), s=>s.replace(/th/,'t'), s=>s.replace(/wh/,'w'), s=>s.replace(/gh/,''), s=>s.replace(/s$/,'z')
  ];
  for(const f of shuffle(tries)){const x=f(w); if(x!==w&&x.length>1) out.add(x); if(out.size>=3) break;}
  // swap a vowel
  let guard=0;
  while(out.size<3 && guard++<30){
    const idx=[...w].map((c,i)=>V.includes(c)?i:-1).filter(i=>i>=0); if(!idx.length) break;
    const i=pick(idx,1)[0]; const nv=pick(V.replace(w[i],'').split(''),1)[0];
    out.add(w.slice(0,i)+nv+w.slice(i+1));
  }
  return [...out].filter(x=>x!==w).slice(0,3);
}

/* ============ generic one-shot speech recognition ============ */
function recognize(target, sentence, onDone){
  if(srBroken){ say(target,0.75); return; }
  if(rec){ try{rec.abort()}catch(e){} rec=null; return; }
  try{ if(ttsOK) speechSynthesis.cancel(); }catch(e){}
  let r; try{ r=new SR(); r.lang='en-US'; r.interimResults=true; r.maxAlternatives=10; r.continuous=true; }catch(e){ toParentMode(); return; }
  rec=r; const heard=[]; let decided=false, timer=null, ft=null;
  const decide=()=>{
    if(decided) return; decided=true; clearTimeout(timer); clearTimeout(ft); try{r.stop()}catch(e){}
    if(!heard.length){ $('#micst')&&($('#micst').textContent='לא שמעתי כלום 🙉 לחצי שוב, קרוב לטלפון, ודברי חזק וברור'); return; }
    onDone(heard);
  };
  r.onstart=()=>{ $('#mic')&&$('#mic').classList.add('rec'); $('#micst')&&($('#micst').textContent='מקשיבה… 👂 דברי עכשיו (אפשר ללחוץ שוב כדי לעצור)'); timer=setTimeout(decide, sentence?12000:6000); };
  r.onresult=e=>{
    let fin=false;
    for(let k=e.resultIndex;k<e.results.length;k++){const res=e.results[k]; for(let i=0;i<res.length;i++){const t=res[i].transcript.trim(); if(t&&!heard.includes(t)) heard.push(t);} if(res.isFinal) fin=true;}
    if(sentence ? judgeLine(target,heard).ok : judge(target,heard).ok) return decide();
    if(fin){ clearTimeout(ft); ft=setTimeout(decide, sentence?1800:700); }
  };
  r.onerror=e=>{ if(['not-allowed','service-not-allowed','audio-capture','network'].includes(e.error)){ decided=true; clearTimeout(timer); toParentMode(); } };
  r.onend=()=>{ if(rec===r) rec=null; $('#mic')&&$('#mic').classList.remove('rec'); if(!decided&&!srBroken) decide(); };
  try{ r.start(); }catch(e){ rec=null; toParentMode(); }
}

// which words of a line were read: union of everything the recognizer heard
function judgeLine(line, alts){
  const heard=[]; for(const a of alts) for(const w of words(a)) if(!heard.includes(w)) heard.push(w);
  const toks=line.split(/\s+/).filter(Boolean);
  let ok=0, numMiss=false; const miss=[];
  toks.forEach((tok,i)=>{
    const parts=normEn(tok).split(' ').filter(Boolean);
    const good=parts.every(p=>heard.some(a=>wordMatch(p,a)) || (STOP.has(p)&&p.length<=3));
    if(good) ok++; else { miss.push(i); if(parts.some(p=>NUMWORDS.has(p))) numMiss=true; }
  });
  const need = LEVEL===1?0.75:0.85;

/* ---- press-to-start / press-to-stop recording (keeps listening until the 2nd tap) ---- */
let REC=null;
function recStart(){
  try{ if(ttsOK) speechSynthesis.cancel(); }catch(e){}
  REC={on:true, heard:[], r:null, cb:null, safety:null};
  recSpawn();
  setMicUI(true);
}
function recSpawn(){
  if(!REC||!REC.on) return;
  let r;
  try{ r=new SR(); r.lang='en-US'; r.interimResults=true; r.maxAlternatives=5; r.continuous=true; }
  catch(e){ REC=null; toParentMode(); setMicUI(false); return; }
  REC.r=r; rec=r;
  r.onresult=e=>{
    for(let k=e.resultIndex;k<e.results.length;k++){const res=e.results[k];
      for(let i=0;i<res.length;i++){const t=res[i].transcript.trim(); if(t&&!REC.heard.includes(t)) REC.heard.push(t);}}
    const last=REC.heard[REC.heard.length-1]; if(last&&$('#live')) $('#live').textContent='🎙️ '+last;
  };
  r.onerror=e=>{
    if(['not-allowed','service-not-allowed','audio-capture'].includes(e.error)){ const cur=REC; REC=null; setMicUI(false); toParentMode(); if(cur&&cur.cb) cur.cb(null); }
    if(e.error==='network'){ const cur=REC; REC=null; setMicUI(false); toParentMode('📶 אין חיבור לאינטרנט – בדיקת הקריאה צריכה אינטרנט. בינתיים: קראי בקול, ואמא או אבא יגידו אם זה נכון.'); if(cur&&cur.cb) cur.cb(null); }
  };
  r.onend=()=>{
    if(rec===r) rec=null;
    if(!REC) return;
    if(REC.on){ setTimeout(recSpawn,120); return; }   // the browser stopped by itself (silence) – keep listening
    recFinish();
  };
  try{ r.start(); }catch(e){ setTimeout(recSpawn,300); }
}
function recStop(cb){
  if(!REC) return;
  REC.on=false; REC.cb=cb;
  try{ REC.r && REC.r.stop(); }catch(e){}
  REC.safety=setTimeout(recFinish,1800);   // in case the browser never fires "end"
  setMicUI(false,true);
}
function recFinish(){
  if(!REC||REC.on) return;
  const cur=REC; REC=null; clearTimeout(cur.safety);
  if(cur.cb) cur.cb(cur.heard);
}
function recAbort(){ if(REC){ REC.on=false; REC.cb=null; try{REC.r&&REC.r.abort()}catch(e){} REC=null; } }
function setMicUI(on,checking){
  const m=$('#mic'); if(!m) return;
  m.classList.toggle('rec',!!on); m.textContent=on?'⏹️':'🎤'; m.disabled=!!checking;
  const st=$('#micst');
  if(st) st.innerHTML = checking ? 'בודקת… ⏳'
    : on ? (ST&&ST.phase==='repeat' ? '🔴 מקליטה… חזרי על המשפט, ולחצי שוב כשסיימת' : '🔴 מקליטה… קראי את השורה, ולחצי שוב כשסיימת')
    : (srBroken ? 'קראי בקול – ואמא או אבא יגידו אם זה נכון' : (ST&&ST.phase==='repeat' ? 'לחצי על המיקרופון וחזרי אחריי' : 'לחצי על המיקרופון והתחילי לקרוא'));
}

function storyStart(){

  const s=makeStory();

}
function lineHTML(line,i){

  return toks.map((t,k)=>`<span class="${i===ST.i&&ST.miss.includes(k)?'missw':''}">${t}</span>`).join(' ');
}
function renderStory(){
  const L=ST.lines;
  $('#app').innerHTML=`
  <div class="topbar"><button class="back" onclick="recAbort();home()">→ יציאה</button>
    <div class="bar"><i style="width:${ST.i/L.length*100}%"></i></div><b>${Math.min(ST.i+1,L.length)}/${L.length}</b></div>

    <div class="sstatus" id="sst">${ST.msg || (ST.phase==='repeat'?'👂 הקשיבי לי, ואז חזרי אחריי':'📖 לחצי על המיקרופון, קראי את השורה המסומנת, ולחצי שוב כשסיימת')}</div>

  </div>`;
  setMicUI(false);

  $('#slisten').onclick=()=>{ if(REC) return; if(ST.phase==='read') ST.helped=true; say(line,0.75); };
  $('#mic').onclick=()=>{
    if(srBroken){ say(line,0.75); return; }
    if(!REC) return recStart();

      const j=judgeLine(line,heard);
      storyResult(j.ok, j.miss, heard[heard.length-1]||'');
    });
  };
  $('#pgood').onclick=()=>storyResult(true,[],'');
  if($('#pbad')) $('#pbad').onclick=()=>storyResult(false,[],'');
}
function storyResult(ok, miss, heard){
  if(!ST||!$('#sst')||ST.i>=ST.lines.length) return;
  const line=ST.lines[ST.i], toks=line.split(/\s+/);
  const heardTxt = heard?`<br><small>שמעתי: <span class="heard">${esc(heard)}</span></small>`:'';
  if(ST.phase==='repeat'){            // after repeating – always move on
    ST.msg = ok ? `${pick(PRAISE,1)[0]} חזרת יפה!` : 'יופי שניסית! 💜 נמשיך';
    return storyNextLine();
  }
  if(ok){
    if(!ST.helped) ST.first++;
    ST.msg=pick(PRAISE,1)[0];
    return storyNextLine();
  }
  // read wrong: mark the words, save them for review, the app reads the line, the child repeats
  ST.miss=miss;
  const missWords=miss.map(k=>toks[k]);
  addReview(missWords); missWords.forEach(w=>{const c=cleanW(w); if(c&&!STOP.has(c)&&!ST.added.includes(c)) ST.added.push(c)});
  ST.phase='repeat';
  ST.msg=(missWords.length?'כמעט! 💪 המילים <b class="missw">באדום</b> היו קשות.<br>':'לא הצלחתי לשמוע את כל השורה 🙉<br>')+'👂 הקשיבי לי, ואז לחצי על המיקרופון וחזרי אחריי'+heardTxt;
  renderStory(); setTimeout(()=>say(line,0.7),400);
}
function storyNextLine(){
  recAbort(); try{rec&&rec.abort()}catch(e){}
  ST.i++; ST.phase='read'; ST.miss=[]; ST.helped=false;
  if(ST.i<ST.lines.length){ const m=ST.msg; ST.msg=''; renderStory(); if(m) $('#sst').innerHTML=m+'<br><span style="font-weight:400">עכשיו השורה הבאה 👇</span>'; return; }
  storyEnd();
}
function storyEnd(){
  const f=ST.first, stars=f>=5?3:f>=4?2:f>=2?1:0;
  const k=skey('story'); const prev=(store[k]&&store[k].stars)||0; store[k]={stars:Math.max(prev,stars),last:f+'/5'}; save();

    ${ST.added.length?`<div class="review"><h3>🔁 נוספו למילים לחזרה:</h3><div class="eng" style="text-align:left">${ST.added.join(', ')}</div></div>`:''}

  </div>`;
  scrollTo(0,0);
}

  <div class="cards">${READ.filter(r=>r.w.startsWith('I ')).map(r=>`<button class="fc" onclick="say('${r.w}',0.8)"><div class="w">${r.w}</div><div class="h">${r.h}</div></button>`).join('')}</div>
  ${LEVEL===3?`<h3 style="margin:20px 4px 8px">🚀 מילים של רמה 3</h3>
  <div class="cards">${VOCAB3.map(v=>`<button class="fc" onclick="say('${v.w}',0.8)"><div class="pic">${picHTML(v)}</div><div class="w">${v.w}</div><div class="h">${v.h}</div></button>`).join('')}</div>
  <h3 style="margin:20px 4px 8px">🔢 מספרים 13–100</h3>
  <div class="bubble" style="font-size:14px">${TEENTIP}</div>
  <div class="cards">${[13,14,15,16,17,18,19,20,30,40,50,60,70,80,90,100,21,35,47,58,99].map(n=>`<button class="fc" onclick="say('${num2w(n)}',0.8)"><div class="pic" style="font-weight:800">${n}</div><div class="w">${num2w(n)}</div><div class="h">${trNum(n)}</div></button>`).join('')}</div>`:''}
  ${LEVEL===4?`<h3 style="margin:20px 4px 8px">👑 מילים של רמה 4</h3>
  <div class="cards">${VOCAB4.map(v=>`<button class="fc" onclick="say('${v.w}',0.8)"><div class="pic">${picHTML(v)}</div><div class="w">${v.w}</div><div class="h">${v.h}</div></button>`).join('')}</div>
  <h3 style="margin:20px 4px 8px">📅 ימי השבוע ומילים מהסיפורים</h3>
  <div class="cards">${WORDS4T.map(v=>`<button class="fc" onclick="say('${v.w}',0.8)"><div class="w">${v.w}</div><div class="h">${v.h}</div></button>`).join('')}</div>
  <h3 style="margin:20px 4px 8px">🔢 מספרים עד 1000</h3>
  <div class="cards">${[100,200,300,500,1000,115,150,213,230,345,354,999].map(n=>`<button class="fc" onclick="say('${num2wBig(n)}',0.8)"><div class="pic" style="font-weight:800">${n}</div><div class="w" style="font-size:14px">${num2wBig(n)}</div></button>`).join('')}</div>`:''}`;
  scrollTo(0,0);
}

let S=null;
function start(key){
  const L=LEVEL-1;
  const qs = key==='exam' ? examQs() : Array.from({length:SECTIONS[key].n},()=>SECTIONS[key].gen[L]());
  S={key,qs,i:0,score:0,missed:[],strict:(LEVEL>=2&&key==='exam')};
  render();
}
function render(){
  const q=S.qs[S.i];
  const listen = q.type==='listen';
  let body;
  if(q.type==='speak'){
    body = renderSpeak(q);
  } else if(q.type==='write'){
    body = `<div class="big" style="font-size:46px">${q.w}</div>
      <input id="ans" class="ans" ${q.num?'dir="ltr" inputmode="numeric" placeholder="123"':'dir="rtl" placeholder="כתבי כאן בעברית…"'} autocomplete="off">
      <div><button class="next" id="chk">בדיקה ✔️</button></div>`;
  } else {
    body = `${listen?`<button class="speak" id="spk" aria-label="להשמיע">🔊</button>
      <div class="again">${ttsOK?'לחצי על הרמקול כדי לשמוע שוב':'<b class="eng" style="font-size:26px">'+q.audio+'</b><br>(הורה מקריא)'}</div>`:q.show}
      <div class="opts ${q.grid||''}">${q.opts.map((o,k)=>`<button class="opt ${q.cls||''}" data-k="${k}">${o.html}</button>`).join('')}</div>`;
  }
  $('#app').innerHTML = `
  <div class="topbar"><button class="back" onclick="home()">→ יציאה</button>
    <div class="bar"><i style="width:${(S.i)/S.qs.length*100}%"></i></div><b>${S.i+1}/${S.qs.length}</b></div>
  <div class="qcard">
    ${S.strict?'<div class="tag">🔥 מבחן אתגר · ניסיון אחד</div>':''}
    <div class="qtitle">${q.title}</div>
    ${body}
    <div class="feedback" id="fb"></div>
  </div>`;
  if(listen){ $('#spk').onclick=()=>say(q.audio); setTimeout(()=>say(q.audio),350); }
  if(q.type==='speak') bindSpeak(q);
  if(q.type==='write'){
    const inp=$('#ans'); $('#chk').onclick=checkWrite;
    inp.addEventListener('keydown',e=>{if(e.key==='Enter')checkWrite()});
    setTimeout(()=>{try{inp.focus()}catch(e){}},200);
  }
  document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>answer(+b.dataset.k,b));
  scrollTo(0,0);
}
function nextBtn(){return `<button class="next" id="nx">${S.i+1<S.qs.length?'הבא ←':'סיום 🎉'}</button>`}
function answer(k,btn){
  const q=S.qs[S.i]; if(q.done) return;
  const o=q.opts[k];
  if(o.ok){
    btn.classList.add('ok');
    if(!q.tried) S.score++;
    q.done=true;
    document.querySelectorAll('.opt').forEach(b=>b.disabled=true);
    $('#fb').innerHTML = `${pick(PRAISE,1)[0]}<span class="hint eng">${q.answer}</span>${nextBtn()}`;
    if(q.word) setTimeout(()=>say(q.word),250);
    $('#nx').onclick=next;
  } else {
    btn.classList.add('no'); btn.disabled=true;
    if(!q.tried){q.tried=true; S.missed.push(q.answer);}
    if(S.strict){
      q.done=true;
      document.querySelectorAll('.opt').forEach((b,i)=>{b.disabled=true; if(q.opts[i].ok) b.classList.add('ok')});
      $('#fb').innerHTML = `${pick(TRY,1)[0]}<span class="hint">התשובה הנכונה מסומנת בירוק: <span class="eng">${q.answer}</span></span>${nextBtn()}`;
      $('#nx').onclick=next;
    } else {
      $('#fb').innerHTML = `${pick(TRY,1)[0]}<span class="hint">נסי שוב${q.type==='listen'?' – אפשר ללחוץ על הרמקול 🔊':''}</span>${q.tip?`<span class="hint">${q.tip}</span>`:''}`;
    }
  }
}
function norm(s){
  return (s||'').replace(/[֑-ׇ]/g,'').replace(/[.,!?'"׳״\-]/g,' ')
    .replace(/ך/g,'כ').replace(/ם/g,'מ').replace(/ן/g,'נ').replace(/ף/g,'פ').replace(/ץ/g,'צ')
    .replace(/\s+/g,' ').trim();
}
function checkWrite(){
  const q=S.qs[S.i]; if(q.done) return;
  const v=norm($('#ans').value); if(!v) return;
  const ok = q.alts.some(a=>{const A=norm(a); return v===A || v.replace(/ /g,'')===A.replace(/ /g,'') || v==='את '+A});
  q.done=true; $('#ans').disabled=true; $('#chk').style.display='none';
  if(ok){
    S.score++; $('#ans').classList.add('ok');
    $('#fb').innerHTML = `${pick(PRAISE,1)[0]}<span class="hint">${q.w} = ${q.alts.slice(0,2).join(' / ')}</span>${nextBtn()}`;
    say(q.w);
  } else {
    $('#ans').classList.add('no'); S.missed.push(q.answer);
    $('#fb').innerHTML = `${pick(TRY,1)[0]}<span class="hint">התשובה הנכונה: <b>${q.alts[0]}</b>${q.alts.length>1?' (אפשר גם: '+q.alts.slice(1,3).join(', ')+')':''}<br>
      <small>חושבת שהתשובה שלך נכונה? תשאלי את אמא או אבא 😊</small></span>${nextBtn()}`;
  }
  $('#nx').onclick=next;
}
function next(){ try{rec&&rec.abort()}catch(e){} S.i++; if(S.i<S.qs.length) render(); else finish(); }
function finish(){
  const pct=S.score/S.qs.length;
  const stars = pct>=0.9?3:pct>=0.7?2:pct>=0.4?1:0;
  const k=skey(S.key);
  const prev=(store[k]&&store[k].stars)||0;
  store[k]={stars:Math.max(prev,stars),last:S.score+'/'+S.qs.length}; save();
  if(stars>=2) confetti();
  const isExam=S.key==='exam';
  const grade=Math.round(pct*100);
  const msg = stars===3?(LEVEL===4?'👑 מומחית-על! את אלופת האנגלית!':LEVEL===3?'וואו! את מומחית לאנגלית! 🚀🏆':LEVEL===2?'וואו! עברת את האתגר! את מוכנה למבחן! 🏆':'את אלופה! מוכנה למבחן! 🏆')
    :stars===2?'עבודה מצוינת! עוד קצת תרגול ואת שם 💪':stars===1?'התחלה טובה! בואי ננסה שוב 🌱':'לא נורא – כל תרגול מקרב אותך! 💜';
  const up = stars===3&&LEVEL<4 ? (LEVEL===1?`<button class="btn2" onclick="setLevel(2)">🔥 לרמה 2</button>`:LEVEL===2?`<button class="btn2" onclick="setLevel(3)">🚀 לרמה 3</button>`:`<button class="btn2" onclick="setLevel(4)">👑 לרמה 4</button>`):'';
  $('#app').innerHTML = `<div class="qcard end">
    <div class="trophy">${stars===3?'🏆':stars===2?'🥈':'🌟'}</div>
    <h2>${msg}</h2>
    <div class="score">${isExam?`ציון: <b>${grade}</b><br>`:''}ענית נכון בפעם הראשונה על <b>${S.score}</b> מתוך ${S.qs.length}<br><span style="font-size:32px">${starRow(stars)}</span></div>
    <div class="btnrow"><button class="next" onclick="start('${S.key}')">שוב! 🔁</button>${up}<button class="btn2" onclick="home()">לתפריט 🏠</button></div>
    ${S.missed.length?`<div class="review"><h3>📌 כדאי לחזור על:</h3><ul>${[...new Set(S.missed)].map(m=>`<li class="eng" style="text-align:left">${m}</li>`).join('')}</ul></div>`:''}
  </div>`;
  scrollTo(0,0);
}

/* ============ PROFILE SCREENS ============ */
let manage=false;
function profiles(){
  try{rec&&rec.abort()}catch(e){}
  document.body.classList.remove('lvl2');
  const cards=PROF.list.map(p=>{
    const st=readStore(p.id);
    return `<div class="pcard-wrap">
      <button class="pcard" onclick="choose('${p.id}')"><span class="pav">${p.av}</span><b>${esc(p.name)}</b><small>⭐ ${totalStars(st)} · ${st._level===4?'👑 רמה 4':st._level===3?'🚀 רמה 3':st._level===2?'🔥 רמה 2':'🌱 רמה 1'}</small></button>
      ${manage?`<div class="pman"><button onclick="editProfile('${p.id}')">✏️ עריכה</button><button onclick="askDel('${p.id}')">🗑️ מחיקה</button></div>`:''}
    </div>`}).join('');
  $('#app').innerHTML=`
  <header><div class="brand"><div class="owl">🦉</div><div><h1>המורה לאנגלית שלי</h1><div class="sub">הכנה למבחן כיתה ג' · 22.11</div></div></div></header>
  <div class="bubble">${PROF.list.length?'מי מתאמן היום? 👋 לחצו על השם שלכם.':'ברוכים הבאים! 👋 קודם כל – בואו ניצור פרופיל לכל ילד. ככה לכל אחד יהיו הכוכבים וההתקדמות שלו.'}</div>
  <div class="pgrid">${cards}
    <button class="pcard add" onclick="editProfile()"><span class="pav">➕</span><b>ילד/ה חדש/ה</b></button>
  </div>
  <div id="delbox"></div>
  ${PROF.list.length?`<div style="text-align:center;margin-top:14px"><button class="lnk" onclick="manage=!manage;profiles()">${manage?'✔️ סיום עריכה':'⚙️ עריכה ומחיקה של ילדים'}</button></div>`:''}
  <div class="note">ההתקדמות של כל ילד נשמרת רק במכשיר הזה ולא נשלחת לשום מקום.</div>`;
  scrollTo(0,0);
}
function choose(id){PROF.cur=id; saveProf(); loadStore(); manage=false; home();}
let draft=null;
function editProfile(id){
  const p=id?PROF.list.find(x=>x.id===id):null;
  draft={id:id||null, name:p?p.name:'', av:p?p.av:AVATARS[PROF.list.length%AVATARS.length], g:p?p.g:'f'};
  renderEdit();
}
function renderEdit(){
  $('#app').innerHTML=`
  <div class="topbar"><button class="back" onclick="profiles()">→ חזרה</button><b style="flex:1">${draft.id?'✏️ עריכת פרופיל':'➕ ילד/ה חדש/ה'}</b></div>
  <div class="qcard">
    <div class="spic" id="bigav">${draft.av}</div>
    <div class="qtitle">איך קוראים לך?</div>
    <input id="pname" class="ans" dir="rtl" maxlength="14" autocomplete="off" placeholder="השם שלי…" value="${esc(draft.name)}">
    <div class="qtitle">בן או בת? <small>(כדי שהאפליקציה תפנה בלשון הנכונה)</small></div>
    <div class="levels" style="max-width:320px;margin:0 auto 14px">
      <button class="lv ${draft.g==='f'?'on':''}" onclick="draft.name=$('#pname').value;draft.g='f';renderEdit()">👧 בת</button>
      <button class="lv ${draft.g==='m'?'on':''}" onclick="draft.name=$('#pname').value;draft.g='m';renderEdit()">👦 בן</button>
    </div>
    <div class="qtitle">בחרו דמות:</div>
    <div class="avgrid">${AVATARS.map(a=>`<button class="avb ${a===draft.av?'on':''}" onclick="draft.name=$('#pname').value;draft.av='${a}';renderEdit()">${a}</button>`).join('')}</div>
    <div class="feedback" id="perr"></div>
    <button class="next" onclick="saveProfile()">שמירה ✔️</button>
  </div>`;
}
function saveProfile(){
  const name=($('#pname').value||'').trim();
  if(!name){$('#perr').textContent='צריך לכתוב שם 🙂';return}
  if(draft.id){
    Object.assign(PROF.list.find(x=>x.id===draft.id),{name,av:draft.av,g:draft.g});
  } else {
    const id='p'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
    if(PROF.list.length===0){ // keep progress from the earlier single-user version
      try{const old=localStorage.getItem('eng3'); if(old) localStorage.setItem('eng3_p_'+id,old);}catch(e){}
    }
    PROF.list.push({id,name,av:draft.av,g:draft.g});
    PROF.cur=id;
  }
  saveProf();
  if(!draft.id){loadStore(); home();} else {if(draft.id===PROF.cur) loadStore(); profiles();}
}
function askDel(id){
  const p=PROF.list.find(x=>x.id===id);
  $('#delbox').innerHTML=`<div class="bubble" style="text-align:center">למחוק את <b>${p.av} ${esc(p.name)}</b>? כל הכוכבים וההתקדמות שלו/ה יימחקו ואי אפשר לשחזר.
    <div class="btnrow" style="margin-top:10px"><button class="btn2" style="background:#ffecec;color:#c0392b" onclick="doDel('${id}')">כן, למחוק</button><button class="btn2" onclick="$('#delbox').innerHTML=''">ביטול</button></div></div>`;
  $('#delbox').scrollIntoView({behavior:'smooth'});
}
function doDel(id){
  PROF.list=PROF.list.filter(x=>x.id!==id);
  try{localStorage.removeItem('eng3_p_'+id)}catch(e){}
  if(PROF.cur===id){PROF.cur=null; loadStore();}
  saveProf(); profiles();
}

/* ---- speak to boys in masculine Hebrew (texts are written in feminine) ---- */
const H='\u0590-\u05FF';
const MASC=[
  ['את אלופה','אתה אלוף'],['וואו, אלופה','וואו, אלוף'],['איזו חכמה','איזה חכם'],['את מוכנה','אתה מוכן'],['ואת שם','ואתה שם'],
  ['את כבר ממש טובה','אתה כבר ממש טוב'],['לא בטוחה','לא בטוח'],['חושבת','חושב'],['אמרה נכון','אמר נכון'],
  ['אני אוהבת','אני אוהב'],['אני רעבה','אני רעב'],['אני משחקת','אני משחק'],['את חוזרת','אתה חוזר'],['קראה נכון','קרא נכון'],['מומחית-על','מומחה-על'],['את אלופת','אתה אלוף'],['חזרי','חזור'],['התחילי','התחל'],['חזרה אחריי','חזר אחריי'],['דלגי','דלג'],['אני יודעת','אני יודע'],['אני אוכלת','אני אוכל'],['את מומחית','אתה מומחה'],['להיות אלופה','להיות אלוף'],['אני גדולה','אני גדול'],['אולי תנסי','אולי תנסה'],
  ['הקשיבי','הקשב'],['ובחרי','ובחר'],['בחרי','בחר'],['קראי','קרא'],['אמרי','אמור'],['לחצי','לחץ'],['נסי','נסה'],
  ['כתבי','כתוב'],['ודברי','ודבר'],['דברי','דבר'],['ותגידי','ותגיד'],['תגידי','תגיד'],['בואי','בוא'],['שימי','שים'],
  ['תשאלי','תשאל'],['תנסי','תנסה'],['ענית','ענית']
].map(([f,m])=>[new RegExp('(^|[^'+H+'])'+f+'(?=$|[^'+H+'])','g'),'$1'+m]);
function masc(s){for(const [r,m] of MASC) s=s.replace(r,m); return s}
function genderize(root){
  const p=curP(); if(!p||p.g!=='m') return;
  const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT); let n;
  while((n=w.nextNode())){const t=masc(n.nodeValue); if(t!==n.nodeValue) n.nodeValue=t;}
  root.querySelectorAll('[placeholder]').forEach(e=>{const t=masc(e.placeholder); if(t!==e.placeholder) e.placeholder=t});
}
try{ new MutationObserver(()=>genderize($('#app'))).observe($('#app'),{childList:true,subtree:true,characterData:true}); }catch(e){}

if(curP()) home(); else profiles();
</script>
