/* ============ HELPERS ============ */
const $ = s=>document.querySelector(s);
const shuffle = a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const pick = (a,n)=>shuffle(a).slice(0,n);
const picHTML = v => v.s ? SVG[v.s] : v.p;
const cap = s => s[0].toUpperCase()+s.slice(1);
const rnd = n => Math.floor(Math.random()*n);
function confusable(a,b){return CONFUSE.some(g=>g.includes(a)&&g.includes(b))}
function sim(a,b){ // rough look-alike score
  let s=0; const A=a.toLowerCase(),B=b.toLowerCase();
  if(A.length===B.length) s+=2;
  for(let i=0;i<Math.min(A.length,B.length);i++) if(A[i]===B[i]) s+=2;
  for(const c of new Set(A)) if(B.includes(c)) s+=1;
  return s+Math.random()*2;
}
function lookalikes(t,pool,n){return pool.filter(v=>v.w!==t.w).sort((x,y)=>sim(t.w,y.w)-sim(t.w,x.w)).slice(0,n)}

let store={};
try{store=JSON.parse(localStorage.getItem('eng3')||'{}')}catch(e){store={}}
function save(){try{localStorage.setItem('eng3',JSON.stringify(store))}catch(e){}}
let LEVEL = store._level===2?2:1;
function setLevel(l){LEVEL=l;store._level=l;save();home();}
const skey = k => LEVEL===2 ? k+'_h' : k;
function totalStars(){return Object.values(store).reduce((s,v)=>s+((v&&v.stars)||0),0)}

/* ---- speech ---- */
let voice=null, ttsOK = 'speechSynthesis' in window;
function loadVoices(){
  if(!ttsOK) return;
  const vs = speechSynthesis.getVoices();
  voice = vs.find(v=>/en[-_]US/i.test(v.lang)&&/Samantha|Google|Female|Aria|Jenny/i.test(v.name))
       || vs.find(v=>/en[-_]US/i.test(v.lang)) || vs.find(v=>/^en/i.test(v.lang)) || null;
}
if(ttsOK){loadVoices(); speechSynthesis.onvoiceschanged=loadVoices;}
function say(text, rate){
  if(!ttsOK) return false;
  try{
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang='en-US'; u.rate=rate||(LEVEL===2?0.95:0.8); if(voice) u.voice=voice;
    speechSynthesis.speak(u); return true;

  zero:'זִירוֹ',one:'וַאן',two:'טוּ',three:"ת'רִי",four:'פוֹר',five:'פַייב',six:'סִיקְס',seven:'סֶבֶן',eight:'אֵייט',nine:'נַיין',
  ten:'טֶן',eleven:'אִילֶבֶן',twelve:'טְוֶלְב','I am':'אַיי אֶם','I like':'אַיי לַייק','I have':'אַיי הֶב'
};
const TIPS = {three:"ב-three שמים את קצה הלשון בין השיניים: ת'רִי (ולא \"טרי\")",mouth:"בסוף mouth הלשון בין השיניים: מָאוּת'",
  bad:'ב-bad פותחים את הפה גדול: בֶּאד (לא כמו bed)',bed:'ב-bed הפה קטן יותר: בֶּד',twelve:'twelve – טְוֶלְב, עם ו קצרה באמצע',
  have:'have נשמע כמו הֶב',elephant:'אֶ-לֶ-פַנְט – שלוש הברות'};
const NEAR = {three:['tree','free','sree'],mouth:['mouse','mouse'],bad:['bed'],bed:['bad'],pen:['pan','pin'],hat:['hot','hut','hit'],
  duck:['dog','doc','dark'],big:['bag','pig'],egg:['ag','ack'],ask:['us'],dad:['dead','did']};
const NUMW = ['zero','one','two','three','four','five','six','seven','eight','nine','ten','eleven','twelve'];
const HOMO = {two:['to','too','tu'],four:['for','fore'],eight:['ate'],one:['won'],grey:['gray'],gray:['grey'],
  i:['eye','hi','ay'],an:['and','a'],a:['an','the','uh'],in:['inn'],pupil:['people','pupils'],bed:['bead'],dad:['that','dead'],egg:['eggs'],eggs:['egg']};
function normEn(s){
  return (s||'').toLowerCase().replace(/[.,!?'"]/g,' ').replace(/\b(\d+)\b/g,(m,d)=>NUMW[+d]||m)
    .replace(/\bgrey\b/g,'gray').replace(/\s+/g,' ').trim();
}
function wEq(a,b){return a===b || (HOMO[a]||[]).includes(b) || (HOMO[b]||[]).includes(a)}
function lev(a,b){const d=[...Array(b.length+1).keys()];for(let i=1;i<=a.length;i++){let p=d[0];d[0]=i;
  for(let j=1;j<=b.length;j++){const t=d[j];d[j]=Math.min(d[j]+1,d[j-1]+1,p+(a[i-1]===b[j-1]?0:1));p=t}}return d[b.length]}
// returns {ok, near, best}
function judge(target, alts){
  const T=normEn(target).split(' ');
  const single = T.length<=2;
  const need = single?1:(LEVEL===2?0.9:0.75);
  let best='', bestR=-1, near=false;
  for(const alt of alts){
    const A=normEn(alt).split(' ').filter(Boolean);
    let hit=0;
    for(const t of T){
      if(A.some(a=>wEq(t,a) || (LEVEL===1 && t.length>=5 && lev(t,a)<=1))) hit++;
    }
    const r=hit/T.length;
    if(r>bestR){bestR=r;best=alt}
    if(single && T.length===1 && (NEAR[T[0]]||[]).some(n=>A.includes(n))) near=true;
  }
  return {ok:bestR>=need, near:near&&bestR<need, best, ratio:bestR};
}

        ?'📶 אין חיבור לאינטרנט – בדיקת הדיבור צריכה אינטרנט. בינתיים: אמרי בקול, ואמא או אבא יגידו אם זה נכון.'
        :(/github\.io$/.test(location.hostname)
          ?'🔇 הדפדפן חוסם את המיקרופון. לחצו על סמל המנעול ליד הכתובת ← מיקרופון ← לאפשר, ונסו שוב. (באייפון: עדיף Safari או Chrome מעודכנים.) בינתיים: אמרי בקול, ואמא או אבא יגידו אם זה נכון.'
          :'🔇 כאן המיקרופון חסום. כדי שהאפליקציה תבדוק לבד – פתחו את האתר <b>avrahamlevy33.github.io/english-kita-gimel</b> ואשרו גישה למיקרופון. בינתיים: אמרי בקול, ואמא או אבא יגידו אם זה נכון.'));
    } else if(e.error==='no-speech'){
      $('#micst').textContent='לא שמעתי כלום 🙉 לחצי שוב ודברי חזק יותר';
    }
  };
  rec.onend=()=>{const m=$('#mic'); if(m) m.classList.remove('rec'); if(!got && !srBroken && $('#micst') && /מקשיבה/.test($('#micst').textContent)) $('#micst').textContent='לחצי על המיקרופון ותגידי';};
  try{ rec.start(); }catch(e){ toParentMode(); }
}
function speakResult(q,ok,heard,near){
  if(q.done || !S || S.qs[S.i]!==q || !$('#mic')) return;
  q.tries++;
  const tip = TIPS[q.target] || (q.target.includes('have')?TIPS.have:'');
  if(ok){
    q.done=true;
    const first = q.tries===1 && !q.helped;
    if(first) S.score++;
    $('#mic').disabled=true; $('#parent').classList.add('hidden'); $('#sw').classList.remove('hidden');
    $('#fb').innerHTML = `${pick(PRAISE,1)[0]}${heard?`<span class="hint">שמעתי: <span class="heard">${heard}</span></span>`:''}
      ${q.heb?`<span class="hint">${q.target} = ${q.heb}</span>`:''}${nextBtn()}`;
    $('#nx').onclick=next;
    return;
  }
  if(q.tries===1) S.missed.push(q.target+(q.tr?' ('+q.tr+')':''));
  $('#sw').classList.remove('hidden');
  const limit = 3;
  if(q.tries>=limit){
    q.done=true; $('#mic').disabled=true; $('#parent').classList.add('hidden');
    $('#fb').innerHTML = `לא נורא! נתרגל את זה עוד 🌱<span class="hint">אומרים: <b class="eng">${q.target}</b>${q.tr?' – '+q.tr:''}</span>${tip?`<span class="hint">💡 ${tip}</span>`:''}${nextBtn()}`;
    $('#nx').onclick=next; say(q.target,0.75);
    return;
  }
  let msg = near ? 'כמעט! 🤏 שימי לב להגייה' : pick(TRY,1)[0];
  $('#fb').innerHTML = `${msg}
    ${heard?`<span class="hint">שמעתי: <span class="heard">${heard}</span></span>`:''}
    <span class="hint">בואי נקשיב ונגיד שוב 👂 (ניסיון ${q.tries} מתוך ${limit})</span>
    ${tip?`<span class="hint">💡 ${tip}</span>`:''}`;
  setTimeout(()=>say(q.target,0.75),400);
}

/* ============ SECTIONS ============ */
const SECTIONS = {
  listen:{name:'שמע ובחר תמונה',ic:'🎧',cls:'c1',n:10,sub:['אוצר מילים','6 תמונות, מילים דומות'],gen:[qListenPicture,qListenPictureH]},
  first:{name:'צליל פותח',ic:'🔤',cls:'c2',n:10,sub:['באיזו אות מתחילה המילה?','6 אותיות, אותיות דומות'],gen:[qFirstSound,qFirstSoundH]},
  numbers:{name:'מספרים 0–12',name2:'מספרים וחשבון',ic:'🔢',cls:'c3',n:10,sub:['שומעים ובוחרים','two plus three = ?'],gen:[qNumber,qNumberH]},
  letters:{name:'אות גדולה וקטנה',ic:'Aa',cls:'c4',n:10,sub:['A B D E G I N T','הפוך + זוגות מבלבלים'],gen:[qLetters,qLettersH]},
  read:{name:'קוראים ומתרגמים',ic:'📖',cls:'c5',n:10,sub:['dad, bag, I like…','מילים דומות + משפטים'],gen:[qRead,qReadH]},
  write:{name:'כותבים בעברית',ic:'✍️',cls:'c7',n:8,sub:[null,'מקלידים את הפירוש'],gen:[null,qWrite]},
  sentence:{name:'משפט ותמונה',ic:'🖼️',cls:'c6',n:8,sub:['I have a dog.','I have three ducks.'],gen:[qSentence,qSentenceH]},
  speak:{name:'אומרים בקול',ic:'🎤',cls:'c9',n:8,sub:['אומרים – והאפליקציה בודקת','בלי לראות את המילה + משפטים'],gen:[qSpeak,qSpeakH]},
  lsent:{name:'שומעים משפט',ic:'👂',cls:'c8',n:8,sub:[null,'בלי לקרוא – רק להקשיב'],gen:[null,qListenSentence]},
};
function examQs(){
  if(LEVEL===1) return [qListenPicture,qListenPicture,qListenPicture,qFirstSound,qFirstSound,qFirstSound,qNumber,qNumber,qNumber,
    qLetters,qLetters,qLetters,qRead,qRead,qRead,qSentence,qSentence,qSentence].map(f=>f());
  return [qListenPictureH,qListenPictureH,qListenPictureH,qListenPictureH,qFirstSoundH,qFirstSoundH,qFirstSoundH,qFirstSoundH,
    qNumberH,qNumberH,qNumberH,qNumberH,qLettersH,qLettersH,qLettersH,qReadH,qReadH,qReadH,qWrite,qWrite,qWrite,
    qSentenceH,qSentenceH,qSentenceH,qListenSentence,qListenSentence].map(f=>f());
}

/* ============ SCREENS ============ */
function starRow(st){return '⭐'.repeat(st)+'☆'.repeat(3-st)}
function home(){
  try{rec&&rec.abort()}catch(e){}
  if(ttsOK){try{speechSynthesis.cancel()}catch(e){}}
  const L=LEVEL-1;
  const daysLeft = Math.ceil((new Date('2026-11-22T08:00:00')-new Date())/86400000);
  const tiles = Object.entries(SECTIONS).filter(([k,s])=>s.gen[L]).map(([k,s])=>{
    const st=(store[skey(k)]&&store[skey(k)].stars)||0;
    return `<button class="tile ${s.cls}" onclick="start('${k}')"><span class="ic">${s.ic}</span><b>${(L&&s.name2)||s.name}</b><small dir="auto">${s.sub[L]}</small>
      <div class="prog">${starRow(st)}</div></button>`}).join('');
  const es=(store[skey('exam')]&&store[skey('exam')].stars)||0;
  const l1done = ['listen','first','numbers','letters','read','sentence','exam'].filter(k=>store[k]&&store[k].stars>=2).length;
  document.body.classList.toggle('lvl2',LEVEL===2);
  $('#app').innerHTML = `
  <header><div class="brand"><div class="owl">🦉</div><div><h1>המורה לאנגלית שלי</h1><div class="sub">הכנה למבחן כיתה ג' · 22.11</div></div></div>
  <div class="stars">⭐ ${totalStars()}</div></header>
  <div class="warn" id="ttswarn">🔇 הדפדפן הזה לא מקריא בקול. בתרגילי ההאזנה המילה תופיע כתובה – שאחד ההורים יקריא אותה.</div>
  <div class="levels">
    <button class="lv ${LEVEL===1?'on':''}" onclick="setLevel(1)">🌱 רמה 1<small>רגיל</small></button>
    <button class="lv ${LEVEL===2?'on':''}" onclick="setLevel(2)">🔥 רמה 2<small>אתגר</small></button>
  </div>
  <div class="bubble">${LEVEL===1
    ?`היי! אני ינשופית 🦉 ואני אעזור לך להצליח במבחן באנגלית. ${daysLeft>0?`נשארו עוד <b>${daysLeft}</b> ימים למבחן.`:''} בכל משחק אפשר לאסוף עד 3 כוכבים.
      ${l1done>=4?'<br>🔥 את כבר ממש טובה – אולי תנסי את <b>רמה 2</b>?':''}`
    :`🔥 <b>רמה 2 – אתגר!</b> כאן יש יותר תשובות לבחור מהן, מילים ואותיות שדומות זו לזו, חשבון באנגלית, משפטים שלמים, וכתיבת הפירוש בעברית – בדיוק כמו במבחן.
      <br>במבחן הניסיון של רמה 2 יש <b>רק ניסיון אחד</b> לכל שאלה. בהצלחה! 💪`}</div>
  <div class="menu">
    ${tiles}
    <button class="tile wide" onclick="start('exam')"><span class="ic">🏆</span><b>${LEVEL===1?'מבחן ניסיון':'מבחן ניסיון – אתגר'}</b>
      <small>${LEVEL===1?'18 שאלות מכל החלקים – כמו במבחן האמיתי':'26 שאלות קשות · ניסיון אחד לכל שאלה · ציון בסוף'}</small>
      <div class="prog">${starRow(es)}</div></button>
    <button class="tile wide" style="background:linear-gradient(135deg,#00b894,#55efc4)" onclick="cards()"><span class="ic">🃏</span><b>כרטיסיות מילים</b><small>כל 33 המילים – לוחצים ושומעים</small></button>
  </div>
  <div class="note">טיפ להורים: כדאי להשתמש עם רמקול או אוזניות. בחלק "כותבים בעברית" צריך מקלדת עברית בטלפון.</div>`;
  if(!ttsOK) $('#ttswarn').style.display='block';
}

function cards(){
  $('#app').innerHTML = `<div class="topbar"><button class="back" onclick="home()">→ חזרה</button><b style="flex:1">🃏 כרטיסיות מילים</b></div>
  <div class="bubble">לחצי על כרטיס כדי לשמוע איך אומרים את המילה. נסי להגיד אותה בקול!</div>
  <div class="cards">${VOCAB.map(v=>`<button class="fc" onclick="say('${v.w}',0.8)"><div class="pic">${picHTML(v)}</div><div class="w">${v.w}</div><div class="h">${v.h}</div></button>`).join('')}</div>
  <h3 style="margin:20px 4px 8px">🔢 מספרים</h3>
  <div class="cards">${NUMBERS.map((n,i)=>`<button class="fc" onclick="say('${n}',0.8)"><div class="pic" style="font-weight:800">${i}</div><div class="w">${n}</div></button>`).join('')}</div>
  <h3 style="margin:20px 4px 8px">📖 צירופים</h3>
  <div class="cards">${READ.filter(r=>r.w.startsWith('I ')).map(r=>`<button class="fc" onclick="say('${r.w}',0.8)"><div class="w">${r.w}</div><div class="h">${r.h}</div></button>`).join('')}</div>`;
  scrollTo(0,0);
}

let S=null;
function start(key){
  const L=LEVEL-1;
  const qs = key==='exam' ? examQs() : Array.from({length:SECTIONS[key].n},()=>SECTIONS[key].gen[L]());
  S={key,qs,i:0,score:0,missed:[],strict:(LEVEL===2&&key==='exam')};
  render();
}
function render(){
  const q=S.qs[S.i];
  const listen = q.type==='listen';
  let body;
  if(q.type==='speak'){
    body = renderSpeak(q);
  } else if(q.type==='write'){
    body = `<div class="big" style="font-size:46px">${q.w}</div>
      <input id="ans" class="ans" dir="rtl" autocomplete="off" placeholder="כתבי כאן בעברית…">
      <div><button class="next" id="chk">בדיקה ✔️</button></div>`;
  } else {
    body = `${listen?`<button class="speak" id="spk" aria-label="להשמיע">🔊</button>
      <div class="again">${ttsOK?'לחצי על הרמקול כדי לשמוע שוב':'<b class="eng" style="font-size:26px">'+q.audio+'</b><br>(הורה מקריא)'}</div>`:q.show}
      <div class="opts ${q.grid||''}">${q.opts.map((o,k)=>`<button class="opt ${q.cls||''}" data-k="${k}">${o.html}</button>`).join('')}</div>`;
  }
  $('#app').innerHTML = `
  <div class="topbar"><button class="back" onclick="home()">→ יציאה</button>
    <div class="bar"><i style="width:${(S.i)/S.qs.length*100}%"></i></div><b>${S.i+1}/${S.qs.length}</b></div>
  <div class="qcard">
    ${S.strict?'<div class="tag">🔥 מבחן אתגר · ניסיון אחד</div>':''}
    <div class="qtitle">${q.title}</div>
    ${body}
    <div class="feedback" id="fb"></div>
  </div>`;
  if(listen){ $('#spk').onclick=()=>say(q.audio); setTimeout(()=>say(q.audio),350); }
  if(q.type==='speak') bindSpeak(q);
  if(q.type==='write'){
    const inp=$('#ans'); $('#chk').onclick=checkWrite;
    inp.addEventListener('keydown',e=>{if(e.key==='Enter')checkWrite()});
    setTimeout(()=>{try{inp.focus()}catch(e){}},200);
  }
  document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>answer(+b.dataset.k,b));
  scrollTo(0,0);
}
function nextBtn(){return `<button class="next" id="nx">${S.i+1<S.qs.length?'הבא ←':'סיום 🎉'}</button>`}
function answer(k,btn){
  const q=S.qs[S.i]; if(q.done) return;
  const o=q.opts[k];
  if(o.ok){
    btn.classList.add('ok');
    if(!q.tried) S.score++;
    q.done=true;
    document.querySelectorAll('.opt').forEach(b=>b.disabled=true);
    $('#fb').innerHTML = `${pick(PRAISE,1)[0]}<span class="hint eng">${q.answer}</span>${nextBtn()}`;
    if(q.word) setTimeout(()=>say(q.word),250);
    $('#nx').onclick=next;
  } else {
    btn.classList.add('no'); btn.disabled=true;
    if(!q.tried){q.tried=true; S.missed.push(q.answer);}
    if(S.strict){
      q.done=true;
      document.querySelectorAll('.opt').forEach((b,i)=>{b.disabled=true; if(q.opts[i].ok) b.classList.add('ok')});
      $('#fb').innerHTML = `${pick(TRY,1)[0]}<span class="hint">התשובה הנכונה מסומנת בירוק: <span class="eng">${q.answer}</span></span>${nextBtn()}`;
      $('#nx').onclick=next;
    } else {
      $('#fb').innerHTML = `${pick(TRY,1)[0]}<span class="hint">נסי שוב${q.type==='listen'?' – אפשר ללחוץ על הרמקול 🔊':''}</span>`;
    }
  }
}
function norm(s){
  return (s||'').replace(/[֑-ׇ]/g,'').replace(/[.,!?'"׳״\-]/g,' ')
    .replace(/ך/g,'כ').replace(/ם/g,'מ').replace(/ן/g,'נ').replace(/ף/g,'פ').replace(/ץ/g,'צ')
    .replace(/\s+/g,' ').trim();
}
function checkWrite(){
  const q=S.qs[S.i]; if(q.done) return;
  const v=norm($('#ans').value); if(!v) return;
  const ok = q.alts.some(a=>{const A=norm(a); return v===A || v.replace(/ /g,'')===A.replace(/ /g,'') || v==='את '+A});
  q.done=true; $('#ans').disabled=true; $('#chk').style.display='none';
  if(ok){
    S.score++; $('#ans').classList.add('ok');
    $('#fb').innerHTML = `${pick(PRAISE,1)[0]}<span class="hint">${q.w} = ${q.alts.slice(0,2).join(' / ')}</span>${nextBtn()}`;
    say(q.w);
  } else {
    $('#ans').classList.add('no'); S.missed.push(q.answer);
    $('#fb').innerHTML = `${pick(TRY,1)[0]}<span class="hint">התשובה הנכונה: <b>${q.alts[0]}</b>${q.alts.length>1?' (אפשר גם: '+q.alts.slice(1,3).join(', ')+')':''}<br>
      <small>חושבת שהתשובה שלך נכונה? תשאלי את אמא או אבא 😊</small></span>${nextBtn()}`;
  }
  $('#nx').onclick=next;
}
function next(){ try{rec&&rec.abort()}catch(e){} S.i++; if(S.i<S.qs.length) render(); else finish(); }
function finish(){
  const pct=S.score/S.qs.length;
  const stars = pct>=0.9?3:pct>=0.7?2:pct>=0.4?1:0;
  const k=skey(S.key);
  const prev=(store[k]&&store[k].stars)||0;
  store[k]={stars:Math.max(prev,stars),last:S.score+'/'+S.qs.length}; save();
  if(stars>=2) confetti();
  const isExam=S.key==='exam';
  const grade=Math.round(pct*100);
  const msg = stars===3?(LEVEL===2?'וואו! עברת את האתגר! את מוכנה למבחן! 🏆':'את אלופה! מוכנה למבחן! 🏆')
    :stars===2?'עבודה מצוינת! עוד קצת תרגול ואת שם 💪':stars===1?'התחלה טובה! בואי ננסה שוב 🌱':'לא נורא – כל תרגול מקרב אותך! 💜';
  const up = LEVEL===1&&stars===3 ? `<button class="btn2" onclick="setLevel(2)">🔥 לרמה 2</button>`:'';
  $('#app').innerHTML = `<div class="qcard end">
    <div class="trophy">${stars===3?'🏆':stars===2?'🥈':'🌟'}</div>
    <h2>${msg}</h2>
    <div class="score">${isExam?`ציון: <b>${grade}</b><br>`:''}ענית נכון בפעם הראשונה על <b>${S.score}</b> מתוך ${S.qs.length}<br><span style="font-size:32px">${starRow(stars)}</span></div>
    <div class="btnrow"><button class="next" onclick="start('${S.key}')">שוב! 🔁</button>${up}<button class="btn2" onclick="home()">לתפריט 🏠</button></div>
    ${S.missed.length?`<div class="review"><h3>📌 כדאי לחזור על:</h3><ul>${[...new Set(S.missed)].map(m=>`<li class="eng" style="text-align:left">${m}</li>`).join('')}</ul></div>`:''}
  </div>`;
  scrollTo(0,0);
}

home();
</script>
